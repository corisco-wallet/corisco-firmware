[package]
name = "corisco-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
description = "Wire protocol (postcard Request/Response, GATT UUIDs, protocol version) between the Corisco app and the device firmware. Host-buildable; no ESP-IDF dependency."

[dependencies]
serde = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
hex = { workspace = true }
serde_json = "1"
