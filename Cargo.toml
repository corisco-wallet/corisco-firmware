[workspace]
resolver = "2"
members = ["corisco-protocol", "firmware-core", "esp32-lilygo-t-display-s3-firmware"]

[workspace.dependencies]
corisco-protocol = { path = "corisco-protocol" }
# Signing logic (github.com/corisco-wallet/crypto-core). Its frost `rev` must match the one below;
# to develop against a local checkout, see CONTRIBUTING.md.
corisco-crypto-core = { git = "https://github.com/corisco-wallet/crypto-core", tag = "v0.1.0" }

esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"

# BLE RPC framing (small, embedded-friendly serde format).
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

hex = "0.4"
sha2 = "0.10"
zeroize = "1"
anyhow = "1"
enumset = "1"
heapless = "0.8"

# On-device FROST self-test only; the rev must match crypto-core's.
frost-secp256k1-tr = { git = "https://github.com/lightsparkdev/frost", rev = "997427e5c09e62459230ad711ef3a33fb64b9424" }
frost-core = { git = "https://github.com/lightsparkdev/frost", rev = "997427e5c09e62459230ad711ef3a33fb64b9424" }
rand_core = "0.6"

cst816s = "1.0.1"

# Defined once so firmware-core and the board crates share identical slint types and features.
slint = { version = "1", default-features = false }

# NimBLE, not Bluedroid: see firmware-core/src/ble.rs.
esp32-nimble = "0.12"

[profile.release]
opt-level = 3
