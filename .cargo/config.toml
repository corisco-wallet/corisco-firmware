[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.3"
# esp-idf-sys can't auto-detect the root crate once proc-macros (slint-macros) build for the host
# too: esp-rs/esp-idf-sys#279.
ESP_IDF_SYS_ROOT_CRATE = "esp32-lilygo-t-display-s3-firmware"
