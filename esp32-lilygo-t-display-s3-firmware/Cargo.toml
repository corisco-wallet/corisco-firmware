[package]
name = "esp32-lilygo-t-display-s3-firmware"
version = "0.1.3"
edition = "2021"
resolver = "2"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

[dependencies]
firmware-core = { path = "../firmware-core" }

corisco-crypto-core = { workspace = true, features = ["seed-lock", "hw-sha512", "transfer-crypto"] }

esp-idf-svc = { workspace = true, features = ["critical-section"] }
esp-idf-hal = { workspace = true }
esp-idf-sys = { workspace = true, features = ["binstart"] }
log = { workspace = true }

hex = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }

cst816s = { workspace = true }

# No "std": it pulls in "systemfonts" -> memmap2, which doesn't build on ESP-IDF's newlib (no mmap).
# That makes "unsafe-single-threaded" required; sound because only the UI thread touches Slint.
# Must match firmware-core's feature set.
slint = { workspace = true, features = ["renderer-software", "libm", "unsafe-single-threaded", "compat-1-2"] }

[build-dependencies]
embuild = "0.33"
slint-build = "1"

[[bin]]
name = "esp32-lilygo-t-display-s3-firmware"
harness = false
