[package]
name = "firmware-core"
version = "0.1.2"
edition = "2021"
resolver = "2"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

[dependencies]
corisco-protocol = { workspace = true }
# "hw-sha512": software PBKDF2 for BIP39 takes ~25s here and trips the watchdog.
corisco-crypto-core = { workspace = true, features = ["seed-lock", "hw-sha512", "transfer-crypto"] }

esp-idf-svc = { workspace = true, features = ["critical-section"] }
log = { workspace = true }

postcard = { workspace = true }
serde = { workspace = true }

hex = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
enumset = { workspace = true }
heapless = { workspace = true }

esp32-nimble = { workspace = true }

# For the on-device FROST self-test only (see src/selftest.rs).
frost-secp256k1-tr = { workspace = true }
# "internals": the self-test adds verifying keys together.
frost-core = { workspace = true, features = ["internals"] }
rand_core = { workspace = true, features = ["getrandom"] }

# Platform glue only; features must match the board crates' (see their Cargo.toml for why).
slint = { workspace = true, features = ["renderer-software", "libm", "unsafe-single-threaded", "compat-1-2"] }
