name: firmware

on:
  push:
    branches: [main]
    paths:
      - "corisco-protocol/**"
      - "protocol/**"
      - "scripts/check-protocol-compat.py"
      - "firmware-core/**"
      - "esp32-lilygo-t-display-s3-firmware/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "sdkconfig.defaults"
      - "rust-toolchain.toml"
      - ".github/workflows/firmware.yml"
      - ".github/actions/esp-toolchain/**"
  pull_request:
    paths:
      - "corisco-protocol/**"
      - "protocol/**"
      - "scripts/check-protocol-compat.py"
      - "firmware-core/**"
      - "esp32-lilygo-t-display-s3-firmware/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "sdkconfig.defaults"
      - "rust-toolchain.toml"
      - ".github/workflows/firmware.yml"
      - ".github/actions/esp-toolchain/**"

jobs:
  # Host-only: no ESP toolchain needed, so this is fast and runs first.
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the compatibility baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # +stable bypasses rust-toolchain.toml (channel "esp", not installed
      # here); --target overrides .cargo/config.toml's xtensa default.
      - name: golden vectors are current
        run: cargo +stable test -p corisco-protocol --target x86_64-unknown-linux-gnu
      - name: compatible with the latest release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "No release tag yet; skipping compatibility check."
            exit 0
          fi
          git show "$tag:protocol/vectors.json" > "$RUNNER_TEMP/baseline.json" || {
            echo "$tag has no protocol/vectors.json; skipping."; exit 0; }
          python3 scripts/check-protocol-compat.py "$RUNNER_TEMP/baseline.json" protocol/vectors.json

  build:
    needs: protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/esp-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            .embuild
          # The cached target/ and .embuild/ (CMake caches) contain absolute
          # paths, so the key must change if the checkout path does (it did
          # when the repo was renamed). Bump the version to force a fresh build.
          key: firmware-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: firmware-v2-${{ runner.os }}-
      - name: build
        run: cargo build --release
