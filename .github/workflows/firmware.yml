name: firmware

on:
  push:
    branches: [main]
    paths:
      - "corisco-protocol/**"
      - "protocol/**"
      - "scripts/check-protocol-compat.py"
      - "firmware-core/**"
      - "esp32-lilygo-t-display-s3-firmware/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "sdkconfig.defaults"
      - "rust-toolchain.toml"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "corisco-protocol/**"
      - "protocol/**"
      - "scripts/check-protocol-compat.py"
      - "firmware-core/**"
      - "esp32-lilygo-t-display-s3-firmware/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "sdkconfig.defaults"
      - "rust-toolchain.toml"
      - ".github/workflows/firmware.yml"

jobs:
  # Host-only: no ESP toolchain needed, so this is fast and runs first.
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the compatibility baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # +stable bypasses rust-toolchain.toml (channel "esp", not installed
      # here); --target overrides .cargo/config.toml's xtensa default.
      - name: golden vectors are current
        run: cargo +stable test -p corisco-protocol --target x86_64-unknown-linux-gnu
      - name: compatible with the latest release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "No release tag yet; skipping compatibility check."
            exit 0
          fi
          git show "$tag:protocol/vectors.json" > "$RUNNER_TEMP/baseline.json" || {
            echo "$tag has no protocol/vectors.json; skipping."; exit 0; }
          python3 scripts/check-protocol-compat.py "$RUNNER_TEMP/baseline.json" protocol/vectors.json

  build:
    needs: protocol
    runs-on: ubuntu-latest
    # espressif/idf-rust ships a full espup-installed Xtensa Rust toolchain
    # + ESP-IDF, so this container has everything `cargo build --release`
    # needs with no espup/export-esp.sh setup step of its own. Tag is keyed
    # by Rust toolchain release, not ESP-IDF version -- if this ever drifts
    # from .cargo/config.toml's pinned `ESP_IDF_VERSION`, pin to a specific
    # dated tag instead of `_latest` (see Docker Hub:
    # https://hub.docker.com/r/espressif/idf-rust/tags).
    container:
      image: espressif/idf-rust:esp32s3_latest
      # The image's default user can't write the runner's temp dir, which
      # makes actions/checkout fail with EACCES.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: firmware-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: firmware-${{ runner.os }}-
      - name: build
        run: |
          # The image's toolchain lives in the `esp` user's home; we run as root
          # (see container options), so point rustup/cargo there explicitly.
          export RUSTUP_HOME=/home/esp/.rustup CARGO_HOME=/home/esp/.cargo
          export PATH=/home/esp/.cargo/bin:$PATH
          [ -f /home/esp/export-esp.sh ] || { ls -la /home/esp /root; exit 1; }
          . /home/esp/export-esp.sh
          cargo build --release
