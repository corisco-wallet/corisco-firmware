name: release-plz

on:
  push:
    branches: [main]
  # Re-attach assets to an existing release (e.g. after a failed build).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to"
        required: true

permissions:
  contents: write
  pull-requests: write

# rust-toolchain.toml pins the Xtensa "esp" channel, which isn't installed on
# a plain runner; release-plz only needs cargo metadata, so use stable.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Tags + GitHub Release for a firmware version that isn't tagged yet.
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[{}]')[0].tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT (not GITHUB_TOKEN) so what release-plz creates triggers
          # other workflows, e.g. CI on the release PR.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Opens/updates the release PR (version bump + CHANGELOG.md) from
  # conventional commits. Merging it triggers the job above.
  release-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Build the flashable image at the release tag.
  build-image:
    needs: release
    if: always() && (needs.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: esp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || inputs.tag }}
      # Referenced from main, not the checkout: re-attaching assets to an
      # older tag must work even though that tag predates this action.
      - uses: corisco-wallet/corisco-wallet/.github/actions/esp-toolchain@main
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash
      # Named <board crate>-<tag>[-app].bin so the file says which board
      # and version it is for, and a second board can't collide with it.
      #   <name>.bin     full 4 MiB flash image (bootloader, partition
      #                  table, app): for a blank board only. Written at
      #                  0x0 it also blanks NVS (seed, PIN counter, bond).
      #   <name>-app.bin app image only: write at 0x10000 to update a
      #                  device without touching NVS.
      - name: build and package
        run: |
          cargo build --release
          elf=target/xtensa-esp32s3-espidf/release/esp32-lilygo-t-display-s3-firmware
          name="esp32-lilygo-t-display-s3-firmware-${{ needs.release.outputs.tag || inputs.tag }}"
          espflash save-image --chip esp32s3 --merge "$elf" "$name.bin"
          espflash save-image --chip esp32s3 "$elf" "$name-app.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: esp32-lilygo-t-display-s3-firmware-*.bin

  # Attach the image + the wire-protocol vectors (what the mobile app pins
  # and tests against) to the GitHub Release.
  upload-assets:
    needs: [release, build-image]
    if: always() && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: upload
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag || inputs.tag }}" \
            esp32-lilygo-t-display-s3-firmware-*.bin protocol/vectors.json --clobber
