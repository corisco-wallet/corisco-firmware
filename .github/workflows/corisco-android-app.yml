name: corisco-android-app

on:
  push:
    branches: [main]
    paths: ["corisco-android-app/**", ".github/workflows/corisco-android-app.yml"]
  pull_request:
    paths: ["corisco-android-app/**", ".github/workflows/corisco-android-app.yml"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corisco-android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: corisco-android-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
