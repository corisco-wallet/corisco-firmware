[workspace]
# Firmware is flashed from GitHub Release assets, never published to crates.io.
publish = false
# Not on crates.io, so the last release must be found from git tags.
git_only = true
# release-plz's semver check builds the crate; it can't build for Xtensa.
semver_check = false
changelog_update = true
git_release_enable = true
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_release_name = "Firmware v{{ version }}"

# One firmware release = one version = one tag. The library crates are
# versioned implicitly by the firmware release that contains them, so they get
# no tags or GitHub releases of their own.
[[package]]
name = "esp32-lilygo-t-display-s3-firmware"
# Commits touching these crates belong in the firmware's changelog.
changelog_include = ["firmware-core", "corisco-protocol"]

[[package]]
name = "firmware-core"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "corisco-protocol"
git_tag_enable = false
git_release_enable = false
